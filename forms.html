        <!--JAVASCRIPT TO HANDLE FORM-->
        <script type="module">

            //Import the superbace client from libeary
            import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
            //My snapbaceURL
            const supabaseUrl = 'https://gsdikywnoplgzwbqpofp.supabase.co';
            //My snapbace API key
            const supabaseKey = 'sb_publishable_bLqwP51ybMcdipss2Jzpwg_WVPDH-AG'
            //create client instince
            const supabase = createClient(supabaseUrl, supabaseKey);


            //Handle from submision data
            const form = document.forms['mobile-techno-form'];
            //add linier to the form
            form.addEventListener('submit', async(e) => {
                //Prevent behaviour
                e.preventDefault(); 
                //Get the values from the form fields
                const fname = document.getElementById('fname').value.trim();
                const lname = document.getElementById('lname').value.trim();
                
                const line1 = document.getElementById('line1').value.trim();
                const line2 = document.getElementById('line2').value.trim();
                const town = document.getElementById('town').value.trim();

                const genderChecked = document.querySelectorAll('input[name="gridRadios"]:checked');
            const gender = genderChecked.length > 0 ? genderChecked[0].value : '';


                const phonetypeChecked = document.querySelectorAll('input[name="phonetype"]:checked');
                const phonetype = Array.from(phonetypeChecked).map(cb => cb.value);
                
                const provider = document.getElementById('provider').value;
                const studyUse = document.getElementById('studyUse').value.trim();
                
                console.log('data:', { fname, lname, line1, line2, town, gender, phonetype, provider, studyUse });


                //Validate the form data (you can add more validation as needed)
                if (!fname || !lname || !gender || !line1 || !town ) {
                    alert('Please fill in all fields.');
                return;
                }

                //Authenticate the user with Supabase (replace with your own email and password)
                const email = 'ddang@eit.ac.nz'; // Replace with your email
                const password = 'daniel1234'; // Replace with your password
                // Handle the authentication result
                authenticateUser(email, password).then((data) => {
                    //If authentication is successful, you can proceed with inserting the data into DB
                    //Call below function insertData to send the data to the supabase API
                    insertData(fname, lname, gender, line1, line2, town, phonetype, provider, studyUse);   
                }).catch((error) => {
                    // If authentication fails, log the error and alert the user
                    console.error('Error authenticating user:', error);
                    alert('ERROR! Authentication failed, user account is not correct!');
                });
            });

            //--------------------------------------------------------
            //Function to authenticate the user with Supabase using email and password
            //--------------------------------------------------------
            async function authenticateUser(email, password) {
                try {
                    // Attempt to sign in the user with the provided email and password
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    // Check for errors and log them to the console
                    if (error) {
                        console.error('Error authenticating user:', error);
                        return null;
                    }
                    // Return the authenticated user data
                    return data;
                } catch (error) {
                    // Log any unexpected errors to the console
                    console.error('Unexpected error during authentication:', error);
                    return null;
                }
            }
            //--------------------------------------------------------
            //"InsertData" function to insert the form data into the 'mobiletechnologyform' table
            //--------------------------------------------------------
            //Asynchronous function
            async function insertData(fname, lname, gender, line1, line2, town, phonetype, provider, studyUse) {
                // Insert the data into the 'mobiletechnologyform' table in Supabase
                const { data, error } = await supabase
                .from('mobiletechnologyform')
                .insert([{fname:fname, lname:lname, gender:gender, line1:line1, line2:line2, town:town, phonetype:phonetype, provider:provider, studyUse:studyUse}]);
                // Check for errors and log them to the console
                if (error) {
                    console.error('Error inserting form data:', error);
                    alert('ERROR! INSERT FAILED!');
                    return null;
                }
                // Return the inserted data
                alert('Data (' + fname + ' ' + lname + ')' + ' inserted successfully!');
                return data;
            } 
        
        </script>
